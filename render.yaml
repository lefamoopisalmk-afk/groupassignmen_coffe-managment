services:
  - type: web
    name: coffee-shop-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: REDIS_URL
        sync: false
      - key: STAFF_API_TOKEN
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
